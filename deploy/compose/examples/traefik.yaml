# Traefik on the host in front of the Compose install (../reverse-proxy.md), as a file of its
# file provider: HTTPS for the host name of HD_PUBLIC_URL on the entry point websecure, with a
# certificate from the resolver letsencrypt, both of Traefik's own configuration, and every
# request passed on to the core, published on the host's loopback address at HD_HTTP_PORT (8080).
# Traefik adds X-Forwarded-For by itself.
http:
  routers:
    helpdesk:
      rule: Host(`helpdesk.example.com`)
      entryPoints: [websecure]
      service: helpdesk
      tls:
        certResolver: letsencrypt
  services:
    helpdesk:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8080
