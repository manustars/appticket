# nginx on the host in front of the Compose install (../reverse-proxy.md): HTTPS for the host
# name of HD_PUBLIC_URL, and every request passed on to the core, published on the host's
# loopback address at HD_HTTP_PORT (8080), but for /webhook, passed on to the Zabbix add-on of
# the profile zabbix at HD_ZABBIX_PORT (8091). Put it in /etc/nginx/conf.d/ with your host name
# and certificate. scripts/test-compose.sh runs this file, with its ports changed.

server {
    listen 80;
    server_name helpdesk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name helpdesk.example.com;

    ssl_certificate     /etc/letsencrypt/live/helpdesk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.example.com/privkey.pem;

    # An import of customers, sites, requesters and assets takes up to 10 MiB; nginx takes 1 MiB
    # unless told otherwise.
    client_max_body_size 10m;

    # The Zabbix add-on's webhook, where Zabbix's media type sends its alerts; leave it out
    # without the profile zabbix.
    location = /webhook {
        proxy_pass http://127.0.0.1:8091;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        # The browser's address, added on the right of what the request already holds: the core
        # counts failed sign-ins under it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
