# The help desk on a single host, with Docker or Podman, from the published images (ADR 0009).
# Copy .env.example to .env beside this file and set what it asks for. The passwords, the mail
# servers' URLs and the tokens are not in .env: each is a file in secrets/, which
# secrets/README.md describes with the permissions they need. Close the directory to other users
# of the host; with the profile db, write the bundled PostgreSQL's password once, before the
# first start; then start:
#
#   chmod 700 secrets
#   docker compose run --rm db-password        (or podman compose run --rm db-password)
#   docker compose up -d                       (or podman compose up -d)
#
# The profiles in COMPOSE_PROFILES (.env) choose what runs beside the core:
#
#   db          the bundled PostgreSQL, its data on the volume db-data, with its dumps on the
#               volume dumps; without it the core uses the existing database that the
#               HD_DATABASE_* settings and secrets/db_password name (docs/external-database.md)
#   dumps       the dumps of an existing database, without db; db has them already (dumps.md)
#   assistant   the Assistant add-on, once registered on the core (secrets/README.md)
#   greenmail   a test mail server, to try the help desk; not for production
#   https       Caddy in front of the core, for a host with no reverse proxy of its own; without
#               it the proxy the host has does HTTPS (reverse-proxy.md)
#
# This is the install's file; the compose.yaml at the root of the repository is for development.
name: hd

services:
  core:
    # A release's archive names the release's version here and in the Assistant's image
    # (.env.example).
    image: ghcr.io/manustars/hd-core:${HD_VERSION:?set HD_VERSION in .env, such as 1.2.3}
    restart: unless-stopped
    # The core's settings, each passed only when .env (or the environment) sets it, so that the
    # core's own default applies to the others: docs/deploy.md and docs/external-database.md
    # describe them. One is always passed, HD_TRUSTED_PROXIES: the core's own default trusts no
    # proxy, while the install's default trusts its own network (HD_SUBNET), where every proxy
    # in front of the core connects from. Its secrets are read from the files mounted below
    # (secrets:), through the _FILE variables.
    environment:
      - HD_DATABASE_HOST
      - HD_DATABASE_PORT
      - HD_DATABASE_NAME
      - HD_DATABASE_USER
      - HD_DATABASE_PASSWORD_FILE=/run/secrets/db_password
      - HD_DATABASE_SSLMODE
      - HD_PUBLIC_URL
      # The optional secrets: each _FILE variable is passed only when .env names the secret's
      # file (HD_SECRET_*). Otherwise the line is a name with nothing after HD_IMAP_URL_, which no
      # one sets, so Compose passes nothing: the core refuses an empty _FILE variable.
      - HD_IMAP_URL_${HD_SECRET_IMAP_URL:+FILE=/run/secrets/imap_url}
      - HD_SMTP_URL_${HD_SECRET_SMTP_URL:+FILE=/run/secrets/smtp_url}
      - HD_MAIL_FROM
      - HD_MAIL_FROM_NAME
      - HD_IMAP_POLL_SECONDS
      - HD_IMAP_IMPORT_EXISTING
      - HD_SIGN_IN_FAILURES
      - HD_SIGN_IN_WINDOW_SECONDS
      # The install's network (networks:, below) unless .env sets it, empty for none: the proxy
      # on the host and Caddy reach the core from addresses of it (reverse-proxy.md).
      - HD_TRUSTED_PROXIES=${HD_TRUSTED_PROXIES-${HD_SUBNET:-172.16.0.0/24}}
      - HD_OIDC_ISSUER
      - HD_OIDC_CLIENT_ID
      - HD_OIDC_CLIENT_SECRET_${HD_SECRET_OIDC_CLIENT_SECRET:+FILE=/run/secrets/oidc_client_secret}
      - HD_OIDC_LABEL
      - HD_OIDC_SESSION_HOURS
      - HD_OIDC_AUTHORIZED_GROUP
      - HD_OIDC_GROUP_CLAIM
      - HD_LOG
    secrets: [db_password, imap_url, smtp_url, oidc_client_secret]
    # Published on the host for the reverse proxy in front of it, which does HTTPS: on the
    # host's loopback address unless HD_HTTP_ADDRESS says otherwise (reverse-proxy.md).
    ports:
      - "${HD_HTTP_ADDRESS:-127.0.0.1}:${HD_HTTP_PORT:-8080}:8080"
    # With the profile db, the core starts once the bundled PostgreSQL is healthy; without it
    # there is nothing to wait for.
    depends_on:
      db:
        condition: service_healthy
        required: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # PostgreSQL from the official image, with no port on the host: only the containers of this
  # install reach it, by the name db. It serves no TLS, hence HD_DATABASE_SSLMODE=disable in
  # .env. The database, its user and its password (secrets/db_password) are read when the data
  # directory is first created and not afterwards: changing them later changes what the core
  # asks for, not what the database has.
  db:
    profiles: [db]
    # The major version (18) changes only through a dump and a restore; the minor version follows
    # the install.
    image: docker.io/library/postgres:18.7-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HD_DATABASE_NAME:-}
      POSTGRES_USER: ${HD_DATABASE_USER:-}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      # Where the image of PostgreSQL 18 keeps its data, under 18/docker: the directory a later
      # major version is upgraded from.
      - db-data:/var/lib/postgresql
    # Over TCP: while the data directory is created the server listens on its socket only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 60
    stop_grace_period: 60s

  # Writes a random password for the bundled PostgreSQL to secrets/db_password, run once before
  # the first start with `docker compose run --rm db-password`; `up` never starts it. Compose
  # mounts a secret only from a file that is there when it creates the containers, which it does
  # before starting any of them, so the password cannot be written by a service that `up` starts.
  # A file already there is kept, never replaced: the database keeps the password it was created
  # with.
  db-password:
    profiles: [db-password]
    image: docker.io/library/busybox:1.37.0
    network_mode: none
    volumes:
      # The directory must already be there, as the install ships it: one created here would be
      # readable by every user of the host.
      - type: bind
        source: ./secrets
        target: /secrets
        bind:
          create_host_path: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        file=/secrets/db_password
        if [ -e "$$file" ]; then
          if [ ! -f "$$file" ] || [ ! -s "$$file" ]; then
            echo "secrets/db_password is there but is not a file holding a password" >&2
            exit 1
          fi
          echo "secrets/db_password is there: kept"
          exit 0
        fi
        if [ "$$(stat -c %a /secrets)" != 700 ]; then
          echo "warning: secrets/ is not 0700, so other users of the host can read it" >&2
        fi
        umask 022
        head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/.db_password.new
        ids=$$(stat -c %u:%g /secrets)
        if [ "$$ids" != "$$(id -u):$$(id -g)" ]; then
          chown "$$ids" /secrets/.db_password.new
        fi
        mv /secrets/.db_password.new "$$file"
        echo "secrets/db_password written"
    read_only: true
    cap_drop: [ALL]
    # To write into the directory, which belongs to the user that runs Compose, and to give that
    # user the file.
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]

  # Dumps the database now, with `docker compose run --rm dumps`; `up` never starts it. Its
  # definition is that of dumps-schedule, below, which `up` starts with the profile db or dumps.
  # Each dump is PostgreSQL's custom format, compressed, named after the time it was taken in UTC
  # (hd-20261125T023000Z.dump) on the volume dumps, which keeps the latest HD_DUMPS_KEEP. dumps.md
  # says how to list the dumps, copy them off the host and restore one.
  dumps: &dumps
    profiles: [dumps-now]
    # pg_dump must be at least as new as the server: the image of db, unless HD_DUMPS_IMAGE_TAG
    # names another, for an existing database of a later major version.
    image: docker.io/library/postgres:${HD_DUMPS_IMAGE_TAG:-18.7-trixie}
    # The database's settings, as the core gets them; its password is read from the file, when a
    # dump starts, and given to pg_dump alone.
    environment:
      - HD_DATABASE_HOST
      - HD_DATABASE_PORT
      - HD_DATABASE_NAME
      - HD_DATABASE_USER
      - HD_DATABASE_SSLMODE
      - HD_DUMPS_KEEP
      - HD_DUMPS_TIME
    secrets: [db_password]
    volumes:
      - dumps:/dumps
    depends_on:
      db:
        condition: service_healthy
        required: false
    # As the image's root, which owns the volume, with no capability: it reads the secret, which
    # every user can, and writes the volume as its owner.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The engine's init runs the script, which is thus not the container's first process, which
    # ignores the signals it has no handler for, and a stop sends SIGTERM rather than the image's
    # SIGINT, which a shell waiting for a command ignores: a stop ends a dump or a restore at once
    # (an interrupted restore changes nothing), and the schedule handles it itself.
    init: true
    stop_signal: SIGTERM
    # The script's first argument says what it does: none, a dump now; schedule, the dumps at
    # HD_DUMPS_TIME every day; restore, a restore of the dump on standard input (dumps.md). Any
    # other command runs as it is, such as ls -l /dumps.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        dumps=/dumps

        # The database, reached as the core reaches it (docs/external-database.md): TLS verified
        # unless HD_DATABASE_SSLMODE says otherwise. The image holds no certificate authority, so
        # without one given in HD_DATABASE_CA_FILE, which the core trusts besides the public
        # ones, TLS is required but the server's certificate is not verified.
        connect() {
          if [ -z "$${HD_DATABASE_HOST:-}" ] || [ -z "$${HD_DATABASE_NAME:-}" ] \
            || [ -z "$${HD_DATABASE_USER:-}" ]; then
            echo "set HD_DATABASE_HOST, HD_DATABASE_NAME and HD_DATABASE_USER in .env" >&2
            return 1
          fi
          export PGHOST="$$HD_DATABASE_HOST" PGDATABASE="$$HD_DATABASE_NAME"
          export PGUSER="$$HD_DATABASE_USER" PGPORT="$${HD_DATABASE_PORT:-5432}"
          mode=$${HD_DATABASE_SSLMODE:-verify-full}
          if [ -n "$${HD_DATABASE_CA_FILE:-}" ]; then
            export PGSSLROOTCERT="$$HD_DATABASE_CA_FILE"
          elif [ "$$mode" = verify-full ] || [ "$$mode" = verify-ca ]; then
            echo "warning: sslmode require, not $$mode: without HD_DATABASE_CA_FILE the server's" \
              "certificate is not verified" >&2
            mode=require
          fi
          export PGSSLMODE="$$mode"
          PGPASSWORD=$$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$$//' /run/secrets/db_password)
          if [ -z "$$PGPASSWORD" ]; then
            echo "secrets/db_password is empty" >&2
            return 1
          fi
          export PGPASSWORD
        }

        # How many dumps to keep, in keep.
        check_keep() {
          keep=$${HD_DUMPS_KEEP:-7}
          case $$keep in
            "" | *[!0-9]*) keep=0 ;;
          esac
          if [ "$$keep" -lt 1 ]; then
            echo "HD_DUMPS_KEEP is to be 1 or more, not '$${HD_DUMPS_KEEP:-}'" >&2
            return 1
          fi
        }

        # Run in a subshell, which releases the lock when it ends, failed or not.
        dump() {
          check_keep || return 1
          connect || return 1
          # One dump at a time on the volume, the schedule's or one taken now; what an
          # interrupted one left is removed under the lock, before the dump.
          exec 9< "$$dumps" || return 1
          flock 9 || return 1
          rm -f "$$dumps"/*.partial
          name=hd-$$(date -u +%Y%m%dT%H%M%SZ).dump
          while [ -e "$$dumps/$$name" ]; do
            sleep 1
            name=hd-$$(date -u +%Y%m%dT%H%M%SZ).dump
          done
          # Written under a temporary name: an interrupted dump never counts as one.
          pg_dump --format=custom --no-owner --file="$$dumps/$$name.partial" || return 1
          mv "$$dumps/$$name.partial" "$$dumps/$$name" || return 1
          # The latest by name, which is the time in UTC: the oldest come first.
          set -- "$$dumps"/hd-*Z.dump
          while [ "$$#" -gt "$$keep" ]; do
            rm -f -- "$$1"
            shift
          done
          echo "dumped $$name; kept:"
          ls -l "$$dumps"
        }

        schedule() {
          time=$${HD_DUMPS_TIME:-02:30}
          case $$time in
            [01][0-9]:[0-5][0-9] | 2[0-3]:[0-5][0-9]) ;;
            *)
              echo "HD_DUMPS_TIME is to be a time of day in UTC, such as 02:30, not '$$time'" >&2
              exit 1
              ;;
          esac
          check_keep || exit 1
          # Stopped at once while it waits; a dump under way ends first, within the service's
          # stop_grace_period, or is cut, leaving a temporary file that the next dump removes.
          trap 'exit 0' TERM INT
          while :; do
            now=$$(date -u +%s)
            next=$$(date -u -d "$$(date -u +%F) $$time" +%s)
            if [ "$$next" -le "$$now" ]; then
              next=$$((next + 86400))
            fi
            echo "next dump at $$(date -u -d "@$$next" +%Y-%m-%dT%H:%M:%SZ)"
            sleep $$((next - now)) &
            wait $$!
            (dump) || echo "the dump failed; the next is at $$time UTC" >&2
          done
        }

        # Into the database, from the dump on standard input, replacing what the dump holds, in
        # one transaction: one that fails changes nothing.
        restore() {
          connect || return 1
          pg_restore --clean --if-exists --no-owner --no-privileges --single-transaction \
            --dbname="$$PGDATABASE" || return 1
          echo "restored"
        }

        case $${1:-} in
          "") (dump) ;;
          schedule) schedule ;;
          restore) (restore) ;;
          *) exec "$$@" ;;
        esac
      - dumps

  # The dumps on a schedule: every day at HD_DUMPS_TIME, in UTC (02:30 when not set). On with
  # the profile db, whose database has no other backup, and turned on with an existing database
  # by the profile dumps.
  dumps-schedule:
    <<: *dumps
    profiles: [db, dumps]
    command: [schedule]
    restart: unless-stopped
    # A dump under way when the service is stopped has this long to end, as db has to shut down;
    # Compose stops this service before db.
    stop_grace_period: 60s

  # The Assistant, which the core sends its events to at http://assistant:8090. It needs the
  # token and event secret that registering it on the core prints, in secrets/assistant_token
  # and secrets/assistant_event_secret (secrets/README.md), so it is started after that. Its
  # settings are in addons/assistant/README.md.
  assistant:
    profiles: [assistant]
    image: ghcr.io/manustars/hd-assistant:${HD_VERSION:?set HD_VERSION in .env, such as 1.2.3}
    restart: unless-stopped
    # The first four set here; the others, as for the core, passed only when set.
    environment:
      - HD_ASSISTANT_LISTEN=0.0.0.0:8090
      - HD_ASSISTANT_CORE_URL=http://core:8080
      - HD_ASSISTANT_TOKEN_FILE=/run/secrets/assistant_token
      - HD_ASSISTANT_EVENT_SECRET_FILE=/run/secrets/assistant_event_secret
      # Optional, as the mail servers' URLs of the core are: some providers take no key.
      - HD_ASSISTANT_API_KEY_${HD_SECRET_ASSISTANT_API_KEY:+FILE=/run/secrets/assistant_api_key}
      - HD_ASSISTANT_MODEL_PROVIDER
      - HD_ASSISTANT_MODEL
      - HD_ASSISTANT_MODEL_URL
      - HD_ASSISTANT_MODEL_EFFORT
      - HD_ASSISTANT_MODEL_CONCURRENCY
      - HD_ASSISTANT_THINKING
      - HD_ASSISTANT_AZURE_API_VERSION
      - HD_ASSISTANT_LOG
    secrets: [assistant_token, assistant_event_secret, assistant_api_key]
    depends_on: [core]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # A test mail server that accepts any message and keeps it in memory, in the mailbox
  # helpdesk@helpdesk.test (login helpdesk, password helpdesk); nothing leaves it. Its SMTP and
  # IMAP ports are published on the host's loopback address, for sending it messages and
  # reading the replies. Not for production.
  greenmail:
    profiles: [greenmail]
    image: docker.io/greenmail/standalone:2.1.8
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=helpdesk:helpdesk@helpdesk.test
        -Dgreenmail.users.login=local_part
    ports:
      - "127.0.0.1:${HD_GREENMAIL_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${HD_GREENMAIL_IMAP_PORT:-3143}:3143"

  # The test mail server on the core's own loopback address, where the core accepts mail
  # without TLS (imap://127.0.0.1:3143, smtp://127.0.0.1:3025): it shares the core's network and
  # passes each connection on to greenmail, with BusyBox's nc.
  greenmail-relay:
    profiles: [greenmail]
    image: docker.io/library/busybox:1.37.0
    restart: unless-stopped
    network_mode: service:core
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nc -lk -s 127.0.0.1 -p 3025 -e nc greenmail 3025 &
        exec nc -lk -s 127.0.0.1 -p 3143 -e nc greenmail 3143
    depends_on: [core, greenmail]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Caddy in front of the core, for a host with no reverse proxy of its own: HTTPS on the ports
  # HD_CADDY_HTTP_PORT and HD_CADDY_HTTPS_PORT (80 and 443) of every address of the host, with
  # the certificate HD_HTTPS_CERTIFICATE names (acme, files or internal), for the address of
  # HD_PUBLIC_URL; the Caddyfile beside this file says what each does. The certificates and
  # Caddy's authority are kept on the volume caddy-data.
  caddy:
    profiles: [https]
    image: docker.io/library/caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      - HD_PUBLIC_URL
      - HD_HTTPS_CERTIFICATE=${HD_HTTPS_CERTIFICATE:-acme}
      - HD_CADDY_HTTP_PORT=${HD_CADDY_HTTP_PORT:-80}
      - HD_CADDY_HTTPS_PORT=${HD_CADDY_HTTPS_PORT:-443}
    # The same port inside as outside, since Caddy listens on the port of HD_PUBLIC_URL. TCP
    # only: the Caddyfile leaves HTTP/3 off.
    ports:
      - "${HD_CADDY_HTTP_PORT:-80}:${HD_CADDY_HTTP_PORT:-80}"
      - "${HD_CADDY_HTTPS_PORT:-443}:${HD_CADDY_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    secrets: [tls_certificate, tls_key]
    depends_on: [core]
    read_only: true
    cap_drop: [ALL]
    # To listen on the ports 80 and 443.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

# The files the services read their secrets from, mounted in /run/secrets/ by their names here;
# secrets/README.md says what each holds. Those of the core, the Assistant and Caddy that an
# install may go without are files only when .env names them (HD_SECRET_*): Compose refuses to
# create a container whose secret's file is missing, so an unused one is /dev/null, which the
# service is not told about.
secrets:
  db_password:
    file: ./secrets/db_password
  imap_url:
    file: ${HD_SECRET_IMAP_URL:-/dev/null}
  smtp_url:
    file: ${HD_SECRET_SMTP_URL:-/dev/null}
  oidc_client_secret:
    file: ${HD_SECRET_OIDC_CLIENT_SECRET:-/dev/null}
  assistant_token:
    file: ./secrets/assistant_token
  assistant_event_secret:
    file: ./secrets/assistant_event_secret
  assistant_api_key:
    file: ${HD_SECRET_ASSISTANT_API_KEY:-/dev/null}
  tls_certificate:
    file: ${HD_SECRET_TLS_CERTIFICATE:-/dev/null}
  tls_key:
    file: ${HD_SECRET_TLS_KEY:-/dev/null}

volumes:
  db-data:
  # The dumps, kept by `down`; `down -v` removes them with db-data.
  dumps:
  caddy-data:
  caddy-config:

# The network of the install's containers, on a subnet that .env can change (HD_SUBNET). A proxy
# on the host reaches the core's published port from the network's gateway, its first address,
# and Caddy from another of its addresses: both are known, and trusted (HD_TRUSTED_PROXIES).
networks:
  default:
    ipam:
      config:
        - subnet: ${HD_SUBNET:-172.16.0.0/24}
