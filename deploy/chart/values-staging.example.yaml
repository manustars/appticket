# An example of a staging install in a lab cluster: one small database, a test mail server, the
# Assistant on a self-hosted model. Copy it, change what is marked, and install with
#
#   helm install hd deploy/chart -n helpdesk-staging -f values-staging.yaml
#
# Names below (hosts, classes, Secrets) are examples: replace them with your cluster's.

core:
  image:
    # A released version, or `latest` while trying things out.
    tag: "0.3.1"
  mail:
    # The test mail server below provides the mailbox; the replies come from its address.
    pollSeconds: 5
  signIn:
    # The addresses the ingress controller connects from, so that failed sign-ins count per
    # address rather than all under the controller (docs/deploy.md, "Failed sign-ins").
    trustedProxies:
      - 10.0.0.0/8                         # your cluster's pod network

ingress:
  enabled: true
  className: nginx                         # your ingress class
  host: helpdesk-staging.example.com       # your host
  annotations:
    # The sign-in cookie needs HTTPS: send plain HTTP to HTTPS.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    enabled: true
    # Empty: the ingress controller's default certificate. Name a TLS Secret (or add a
    # cert-manager annotation above) for a certificate of your own.
    secretName: ""

postgresql:
  enabled: true
  instances: 1
  storage:
    size: 2Gi
    storageClass: ""                       # empty: the cluster's default
  backup:
    # Off for a throwaway staging install; see values.yaml for volume snapshots or object storage.
    enabled: false

# A daily dump of the database to a volume, keeping a week of them: backups without object
# storage.
dumps:
  enabled: true
  keep: 7
  storage:
    size: 2Gi

# Mail stays in memory: a restart of the core's pod empties the test mailbox.
greenmail:
  enabled: true

assistant:
  # Enable after registering the add-on and creating the Secret (docs/deploy.md).
  enabled: false
  secret:
    existingSecret: hd-assistant           # keys: token, event-secret, api-key
  model:
    provider: openai-compatible
    name: my-local-model                   # your model's id
    url: http://models.example.com/v1      # your model server
    # One call at a time: a self-hosted model is often a single shared GPU (the default for
    # openai-compatible already).
    concurrency: "1"

networkPolicy:
  enabled: false
