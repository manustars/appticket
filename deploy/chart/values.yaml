# Values of the help desk chart. Secrets are never values here: the chart refers to Kubernetes
# Secrets by name, which you create before installing (docs/kubernetes.md, "Secrets to create").
# The one Secret the chart makes itself is the generated password of its own PostgreSQL
# (postgresql.standalone).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# ---------------------------------------------------------------------------------------------
# The core: API, agents' UI, mail reading and sending, add-on events.
# ---------------------------------------------------------------------------------------------
core:
  image:
    repository: ghcr.io/manustars/hd-core
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Keep 1: the core reads one mailbox and runs its outbox; the chart also replaces the pod
  # rather than rolling it, so that two cores never run at once.
  replicas: 1

  # The core's connection to an external database (postgresql.mode=external, below). With
  # postgresql.mode=cloudnativepg the chart refuses existingSecret, sslMode and ca.existingSecret:
  # it uses the app Secret the cluster creates, and the core verifies the cluster's certificate
  # (verify-full) against the cluster's own authority, from its Secret <cluster>-ca.
  #
  # TLS: an external database on another host is reached with verify-full unless its URL carries
  # an sslmode or sslMode says otherwise (docs/kubernetes.md, "TLS to the database").
  database:
    # A Secret holding the database as a postgres:// URL (HD_DATABASE_URL), instead of the
    # separate values of postgresql.external.
    existingSecret: ""
    secretKey: uri
    # HD_DATABASE_SSLMODE: verify-full, verify-ca, require, prefer or disable. Empty: verify-full
    # for another host. Not with a URL that carries its own sslmode.
    sslMode: ""
    # A Secret with a PEM file of the authorities that issued the database's certificate
    # (HD_DATABASE_CA_FILE), for a private authority.
    ca:
      existingSecret: ""
      secretKey: ca.crt

  mail:
    # HD_MAIL_FROM: the help desk's own address, which replies come from. Without it agents
    # cannot reply. With greenmail.enabled and nothing set, the test mailbox's address.
    from: ""
    fromName: "Help desk"
    # HD_IMAP_URL (imaps://user:password@host/INBOX), from a Secret. Without it no mail is read,
    # unless greenmail.enabled.
    imap:
      existingSecret: ""
      secretKey: imap-url
    # HD_SMTP_URL (smtps://user:password@host or smtp://…?tls=required), from a Secret. Without
    # it replies wait in the outbox, unless greenmail.enabled.
    smtp:
      existingSecret: ""
      secretKey: smtp-url
    # A Secret with a PEM file of extra certificate authorities for the mail servers
    # (HD_MAIL_CA_FILE), for servers with a private CA.
    ca:
      existingSecret: ""
      secretKey: ca.crt
    # Seconds between two reads of the mailbox.
    pollSeconds: 30
    # Import the mail already in the mailbox on the very first read (normally left alone).
    importExisting: false

  # Limits on failed sign-ins, per account and per address (docs/kubernetes.md, "Failed
  # sign-ins"). After `failures` failures within `windowSeconds`, the next four attempts wait 1,
  # 2, 4 and 8 seconds, and attempts after those are refused until `windowSeconds` have passed
  # since the last failure: at most failures + 4 passwords are checked per account within a
  # window.
  signIn:
    # HD_SIGN_IN_FAILURES (1 to 100)
    failures: 5
    # HD_SIGN_IN_WINDOW_SECONDS (1 to 86400)
    windowSeconds: 900
    # HD_TRUSTED_PROXIES: the reverse proxies whose X-Forwarded-For gives the address a sign-in
    # counts under, as addresses or networks. With the Ingress, list the addresses the ingress
    # controller's pods connect from, such as the cluster's pod network (10.0.0.0/8); empty,
    # every sign-in counts under the controller's address.
    trustedProxies: []

  # HD_PUBLIC_URL: the address agents open the help desk at, such as
  # https://helpdesk.example.com; the identity provider sends them back to it. Empty: https:// and
  # ingress.host when the Ingress is enabled; required with an identity provider otherwise.
  publicUrl: ""

  # Signing in through an OpenID Connect identity provider (docs/deploy.md). Off while the issuer
  # is empty; agents then sign in with their local password only.
  oidc:
    # HD_OIDC_ISSUER, such as https://login.example.com/realms/staff.
    issuer: ""
    # HD_OIDC_CLIENT_ID: the client registered at the provider for the help desk.
    clientId: ""
    # A Secret with the client's secret (HD_OIDC_CLIENT_SECRET); required with an issuer.
    existingSecret: ""
    secretKey: client-secret
    # HD_OIDC_LABEL: the sign-in button reads "Sign in with <label>". Empty: "OpenID Connect".
    label: ""
    # HD_OIDC_SESSION_HOURS: how long a session opened through the provider lasts (1 to 24).
    sessionHours: 12
    # HD_OIDC_AUTHORIZED_GROUP: only the provider's users in this group sign in, checked at
    # every sign-in, and someone in it who is not an agent yet becomes one with the default role.
    # Empty: only existing agents sign in.
    authorizedGroup: ""
    # HD_OIDC_GROUP_CLAIM: the ID token claim the authorized group is looked for in, such as
    # roles for an Entra ID app role.
    groupClaim: groups

  # HD_LOG: a tracing filter.
  log: "info,sqlx=warn"

  # More environment variables, as a list of EnvVar objects.
  extraEnv: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # The IngressClass, such as nginx; empty: the cluster's default class.
  className: ""
  # Extra annotations, such as nginx.ingress.kubernetes.io/force-ssl-redirect: "true", or a
  # cert-manager issuer.
  annotations: {}
  host: helpdesk.example.com
  # The agents' sign-in cookie is marked Secure: the UI only works over HTTPS (or through a
  # port-forward to localhost). Terminate TLS here or in front of the cluster.
  tls:
    enabled: true
    # A Secret of type kubernetes.io/tls, existing or created by cert-manager. Empty: the host is
    # listed for TLS without a Secret, and the ingress controller uses its default certificate.
    secretName: ""

# ---------------------------------------------------------------------------------------------
# The Assistant add-on (optional). Register it on the core first (`hd addon add …`, see
# docs/deploy.md), put the printed token and event secret in a Secret, then enable it.
# ---------------------------------------------------------------------------------------------
assistant:
  enabled: false
  image:
    repository: ghcr.io/manustars/hd-assistant
    tag: ""
    pullPolicy: IfNotPresent

  # A Secret with the add-on's credentials and, for hosted providers, the model service's key.
  secret:
    existingSecret: ""
    tokenKey: token
    eventSecretKey: event-secret
    # Optional in the Secret: self-hosted servers often need no key.
    apiKeyKey: api-key

  # The model: there is no default provider or model, both are required when enabled.
  model:
    # anthropic, openai, mistral, gemini, azure-openai, ollama or openai-compatible.
    provider: ""
    # The model's id; for azure-openai, the deployment's name.
    name: ""
    # The service's base URL; required for azure-openai and openai-compatible.
    url: ""
    # Optional settings, sent only when set: HD_ASSISTANT_MODEL_CONCURRENCY,
    # HD_ASSISTANT_MODEL_EFFORT (anthropic), HD_ASSISTANT_THINKING (openai-compatible: on|off),
    # HD_ASSISTANT_AZURE_API_VERSION (azure-openai).
    concurrency: ""
    effort: ""
    thinking: ""
    azureApiVersion: ""

  # The core's URL as the Assistant calls it. Empty: the core's Service in this release.
  coreUrl: ""
  # HD_ASSISTANT_LOG
  log: "info"
  extraEnv: []

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------
# The Zabbix add-on (optional): Zabbix's hosts as assets, and tickets from its alerts by rules
# (addons/zabbix/README.md). Register it on the core first (`hd addon add zabbix …`, see
# docs/deploy.md), put the printed token and event secret in a Secret with the Zabbix user's API
# token and the webhook's secret, write its configuration below, then enable it.
# ---------------------------------------------------------------------------------------------
zabbix:
  enabled: false
  image:
    repository: ghcr.io/manustars/hd-zabbix
    tag: ""
    pullPolicy: IfNotPresent

  # A Secret with the add-on's credentials, mounted as files.
  secret:
    existingSecret: ""
    # The token and the event secret `hd addon add` printed.
    tokenKey: token
    eventSecretKey: event-secret
    # The API token of the add-on's Zabbix user.
    apiTokenKey: api-token
    # The webhook's secret, of 16 characters or more, which the media type sends from the
    # global macro {$HD_WEBHOOK_SECRET}; needed with webhook.enabled.
    webhookSecretKey: webhook-secret

  # The configuration file (zabbix.toml) without the sections [core], [addon] and [webhook],
  # which the chart writes from the values below: [zabbix] with url, [assets] with default_kind,
  # and optionally [sync] and [alerts] with the rules (addons/zabbix/README.md, "Configuration").
  # Required when enabled. Such as:
  #   config: |
  #     [zabbix]
  #     url = "https://zabbix.example.com"
  #
  #     [assets]
  #     default_kind = "Server"
  config: ""

  # The core's URL as the add-on calls it (core.url). Empty: the core's Service in this release.
  coreUrl: ""
  # The help desk's UI as agents' browsers reach it, for the ticket's page that Zabbix's event
  # menu opens (core.ui_url). Empty: core.publicUrl, else https:// and ingress.host with the
  # Ingress, else the core's URL above.
  uiUrl: ""

  webhook:
    # Receive Zabbix's alerts on /webhook ([webhook]); without it the add-on opens no tickets.
    enabled: true
    # The name of the media type that sends them (webhook.media_type). Empty: Help desk.
    mediaType: ""

  # The add-on's Service, which the core reaches and, inside the cluster, Zabbix's server, at
  # http://<release>-zabbix:8091/webhook. LoadBalancer or NodePort for a Zabbix outside the
  # cluster without the Ingress below; the webhook is then plain HTTP.
  service:
    type: ClusterIP
    annotations: {}

  # The webhook through the ingress controller: the path /webhook of ingress.host, over the
  # Ingress's TLS, to the add-on; its other paths stay inside the cluster. Uses ingress.className,
  # ingress.tls and ingress.annotations, with these annotations over them.
  ingress:
    enabled: false
    annotations: {}

  # HD_ZABBIX_LOG
  log: "info"
  extraEnv: []

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------
# The database. postgresql.mode says where it comes from:
# - standalone, the default: PostgreSQL 18 run by the chart itself, with no operator: one
#   instance on a volume that outlives the release, reached by the core inside the cluster
#   without TLS, with database dumps on unless turned off; the values under `standalone`
#   describe it;
# - cloudnativepg: a PostgreSQL cluster managed by the CloudNativePG operator, which must be
#   installed in the cluster; the values below, other than `external` and `standalone`,
#   describe it. It was the default before 0.4.0: a release that runs on the cluster says so
#   here from then on;
# - external: a PostgreSQL 16 or later database of your own, dedicated to the help desk
#   (docs/external-database.md), given in one of two forms: a Secret holding its URL
#   (core.database.existingSecret), or the separate values under `external`.
#
# The chart refuses an install or an upgrade whose mode is not that of the database it finds
# (ADR 0009), so that the core never starts on another, empty database: any mode but
# cloudnativepg while the CloudNativePG cluster <release>-db exists, and any mode but standalone
# while the StatefulSet <release>-postgresql of its own PostgreSQL exists. For that Helm must
# read the cluster: a tool that renders the chart without reading it, such as Argo CD and
# anything else built on `helm template`, runs no such check, and neither does
# `helm upgrade --dry-run` unless it is --dry-run=server. Set the mode explicitly there, and
# in standalone mode the password's Secret too (postgresql.standalone.existingSecret).
#
# The chart also refuses:
# - postgresql.enabled, which postgresql.mode replaces: false was external, and so was true
#   beside core.database.existingSecret; true alone was cloudnativepg;
# - in cloudnativepg and standalone mode, what names an external database:
#   core.database.existingSecret, sslMode and ca.existingSecret, and postgresql.external.host,
#   name, user and password.existingSecret;
# - in standalone mode, an image tag of another major version than 18 or given as a number,
#   and on an upgrade a secretKey that the Secret with the generated password does not have;
# - in external mode, both forms together, the separate values in part, and neither form;
# - with the dumps on, a dumps.image.tag given as a number.
# It ignores, without a message: the values of the modes not chosen (in external and standalone
# mode the cluster's instances, storage, backup and the others; outside standalone mode
# postgresql.standalone); beside a URL Secret and outside external mode,
# postgresql.external.port and password.secretKey; with the separate values,
# core.database.secretKey.
# ---------------------------------------------------------------------------------------------
postgresql:
  mode: standalone

  # An external database as separate values (HD_DATABASE_HOST, _PORT, _NAME, _USER and
  # _PASSWORD): set host, name, user and the password's Secret, all four. core.database.sslMode
  # and core.database.ca apply to it as they do to a URL.
  external:
    # The server's host name or address; with verify-full, a name its certificate lists.
    host: ""
    port: 5432
    # The database, dedicated to the help desk.
    name: ""
    # The user the core connects as, which owns the database and applies the migrations.
    user: ""
    # A Secret holding that user's password as it is, with no percent-encoding.
    password:
      existingSecret: ""
      secretKey: password

  # The chart's own PostgreSQL (postgresql.mode=standalone): one instance of the official image
  # in a StatefulSet, with the database `hd` owned by the user `hd`. Its volume is never deleted
  # by the chart: `helm uninstall` leaves it, and installing again under the same release name
  # takes it back.
  standalone:
    image:
      repository: docker.io/library/postgres
      # The chart fixes the major version (18) and refuses a tag of another one; the minor
      # version follows the chart. A major version changes only through a dump and a restore.
      # Quoted: YAML reads 18.10 as the number 18.1, and the chart refuses a tag that is a number
      # (with --set, use --set-string).
      tag: "18.7-trixie"
      pullPolicy: IfNotPresent
    # The password of the user `hd`. Empty: the chart generates one on the first install, into
    # the Secret <release>-postgresql, which upgrades keep and `helm uninstall` leaves in place
    # beside the volume.
    #
    # Set it with a tool that renders the chart without reading the cluster, such as Argo CD and
    # other GitOps tools (anything built on `helm template`): there the chart cannot find the
    # Secret it made, and would generate another password at every sync, which the database
    # does not accept. Name a Secret of your own instead, created before installing, holding
    # the password as it is.
    #
    # PostgreSQL takes the password when it first creates the data directory: changing the
    # Secret afterwards does not change the password in the database.
    existingSecret: ""
    # The key of the password in the Secret. For the generated one, the key of the first
    # install: the chart refuses an upgrade that names a key the Secret it made does not have.
    secretKey: password
    # The volume as it is first created: a StatefulSet's volume claim cannot change afterwards,
    # and an upgrade that changes the size or the class here is refused by Kubernetes.
    storage:
      size: 5Gi
      # Empty: the cluster's default StorageClass.
      storageClass: ""
    resources: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # The CloudNativePG cluster (postgresql.mode=cloudnativepg), from here on.
  #
  # Leave the database cluster, and so its data, in place on `helm uninstall`. Delete it by hand
  # (kubectl delete cluster <release>-db) when you really mean to.
  keepOnUninstall: true
  instances: 1
  # An exact PostgreSQL image for the cluster; empty: the operator's default.
  imageName: ""
  database: hd
  owner: hd
  storage:
    size: 5Gi
    # Empty: the cluster's default StorageClass.
    storageClass: ""
  resources: {}

  # Scheduled backups, off by default. Pick one method:
  # - volumeSnapshot: CSI volume snapshots of the database volume (needs a VolumeSnapshotClass);
  # - objectStore: base backups and WAL archiving to S3-compatible storage through the Barman
  #   Cloud plugin (needs the plugin installed next to the operator).
  backup:
    enabled: false
    method: volumeSnapshot
    # Six fields, seconds first: "0 0 2 * * *" is every day at 02:00.
    schedule: "0 0 2 * * *"
    volumeSnapshot:
      # Required with this method: the VolumeSnapshotClass of the database volume.
      className: ""
    objectStore:
      # s3://bucket/path/
      destinationPath: ""
      # For S3-compatible services other than AWS, such as MinIO.
      endpointURL: ""
      # A Secret with the access key id and secret access key.
      credentialsSecret: ""
      accessKeyIdKey: ACCESS_KEY_ID
      secretAccessKeyKey: ACCESS_SECRET_KEY
      # How long backups are kept, such as 30d, 4w or 6m.
      retentionPolicy: 30d

# ---------------------------------------------------------------------------------------------
# Database dumps: a CronJob runs pg_dump on a schedule and keeps the latest dumps on a volume.
# Works in every database mode and needs no object storage. The dumps are PostgreSQL's custom
# format, compressed; restore with pg_restore.
#
# The chart's own PostgreSQL (postgresql.mode=standalone) is reached inside the cluster without
# TLS, as the core reaches it.
#
# TLS to an external database, in either form: the job's image holds no public certificate
# authorities, so pg_dump verifies the server's certificate only against core.database.ca.
# - With core.database.ca: core.database.sslMode, verify-full when empty, against that authority.
# - Without it: TLS is required but the certificate is not verified (sslmode=require) where the
#   core verifies it (sslMode empty, verify-full or verify-ca); a weaker sslMode is used as it is.
#   To have pg_dump verify a certificate from a public authority, give that authority in
#   core.database.ca: the core trusts it besides the public ones.
# - A URL that carries its own sslmode keeps it, and with verify-full or verify-ca there pg_dump
#   fails without core.database.ca.
# The dumps of the CloudNativePG cluster use its URL as it is.
# ---------------------------------------------------------------------------------------------
dumps:
  # true or false. Empty: on with postgresql.mode=standalone (the default), whose database has
  # no other backup, and off in the other modes.
  enabled: ""
  # Standard five-field cron: "30 2 * * *" is every day at 02:30 (the cluster's time zone).
  schedule: "30 2 * * *"
  # How many dumps to keep; older ones are deleted after each successful dump.
  keep: 7
  # How long a dump may take, waiting for its pod included, before it fails (6 hours). A dump
  # still running then holds back the next one.
  activeDeadlineSeconds: 21600
  image:
    # pg_dump must be at least as new as the server: keep its major version in step with the
    # database's.
    repository: docker.io/library/postgres
    # Quoted, as the standalone tag: the chart refuses a tag that is a number (with --set, use
    # --set-string).
    tag: "18.7-trixie"
    pullPolicy: IfNotPresent
  storage:
    # Use an existing PersistentVolumeClaim; empty: the chart creates one, kept on uninstall.
    existingClaim: ""
    size: 5Gi
    # Empty: the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------------------------
# A test mail server for staging (off by default). GreenMail runs next to the core in the same
# pod, because the core accepts plain imap:// and smtp:// only for a server on its own host. It
# accepts any mail and keeps it in one mailbox; nothing leaves it. With it enabled and no IMAP or
# SMTP Secret set, the core reads and sends through it. It keeps mail in memory only: a pod
# restart empties the mailbox, and the core's next read starts over with what arrives after it.
# ---------------------------------------------------------------------------------------------
greenmail:
  enabled: false
  image:
    repository: docker.io/greenmail/standalone
    tag: "2.1.8"
    pullPolicy: IfNotPresent
  # The test mailbox: login, password and address (made up, not real accounts).
  user: helpdesk
  password: helpdesk
  address: helpdesk@helpdesk.test
  # A Service for testers to send mail in (SMTP 3025) and read it (IMAP 3143).
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 384Mi

# ---------------------------------------------------------------------------------------------
# Optional NetworkPolicies: the core accepts traffic from the peers below and from the add-ons;
# the Assistant accepts traffic only from the core. The Zabbix add-on accepts traffic from the
# core and from zabbix.webhookFrom (and coreFrom with zabbix.ingress.enabled), and is the one
# whose egress is limited too: to the name service, the core and zabbix.apiTo.
# ---------------------------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # Peers allowed to reach the core's HTTP port, such as the ingress controller's namespace:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  coreFrom: []
  zabbix:
    # Peers allowed to reach the add-on's webhook (its port 8091), such as Zabbix's server:
    #   - ipBlock:
    #       cidr: 192.0.2.10/32
    # Empty: only the core, and the ingress controller with zabbix.ingress.enabled.
    webhookFrom: []
    # Where the add-on reaches Zabbix's API (zabbix.url), as peers, such as an ipBlock. Empty:
    # any address, on apiPorts.
    apiTo: []
    # The ports of Zabbix's API.
    apiPorts: [443, 80]
