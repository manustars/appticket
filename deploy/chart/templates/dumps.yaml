{{- if include "hd.dumpsEnabled" . }}
{{- $d := .Values.dumps }}
{{- $databaseSource := include "hd.databaseSource" . }}
{{- /* The database as separate parameters: pg_dump gets them as its own variables. */}}
{{- $parameters := include "hd.databaseParameters" . | fromYaml }}
{{- /*
An external database is reached over TLS as the core reaches it, as far as the image allows: it
holds no public authorities, so pg_dump verifies the server's certificate against the authority
of core.database.ca, and without one requires TLS where the core verifies.
*/}}
{{- $externalDatabase := hasPrefix "external" $databaseSource }}
{{- $db := .Values.core.database }}
{{- $caSecret := ternary $db.ca.existingSecret "" $externalDatabase }}
{{- $sslMode := $db.sslMode | default "verify-full" }}
{{- if and (not $caSecret) (has $sslMode (list "verify-full" "verify-ca")) }}
{{- $sslMode = "require" }}
{{- end }}
{{- /* The chart's own PostgreSQL serves no TLS: said explicitly, as for the core. */}}
{{- if eq $databaseSource "standalone" }}
{{- $sslMode = "disable" }}
{{- end }}
{{- $name := include "hd.dumpsName" . }}
{{- $claim := $d.storage.existingClaim | default $name }}
{{- if lt (int $d.keep) 1 }}
{{- fail "dumps.keep must be 1 or more" }}
{{- end }}
{{- include "hd.requireStringTag" (dict "name" "dumps.image.tag" "tag" $d.image.tag) }}
{{- if not $d.storage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "hd.labels" . | nindent 4 }}
    app.kubernetes.io/component: dumps
  annotations:
    # The dumps are backups: helm uninstall leaves them in place.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $d.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $d.storage.size }}
---
{{- end }}
# pg_dump of the help desk's database on a schedule, keeping the latest dumps.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "hd.labels" . | nindent 4 }}
    app.kubernetes.io/component: dumps
spec:
  schedule: {{ $d.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "hd.labels" . | nindent 12 }}
            app.kubernetes.io/component: dumps
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "hd.podSecurityContext" . | nindent 12 }}
          {{- if include "hd.dumpsBesideDatabase" . }}
          # On the node of the chart's own PostgreSQL, which mounts the same ReadWriteOnce claim.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "hd.selectorLabels" (dict "root" . "component" "postgresql") | nindent 22 }}
          {{- end }}
          containers:
            - name: pg-dump
              image: {{ printf "%s:%s" $d.image.repository $d.image.tag }}
              imagePullPolicy: {{ $d.image.pullPolicy }}
              env:
                {{- if $parameters }}
                # The connection parameters pg_dump reads by itself.
                - name: PGHOST
                  value: {{ $parameters.host | quote }}
                - name: PGPORT
                  value: {{ $parameters.port | toString | quote }}
                - name: PGDATABASE
                  value: {{ $parameters.name | quote }}
                - name: PGUSER
                  value: {{ $parameters.user | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $parameters.secret }}
                      key: {{ $parameters.key }}
                {{- else }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "hd.databaseSecret" . }}
                      key: {{ $db.secretKey }}
                {{- end }}
                {{- if ne $databaseSource "cloudnativepg" }}
                {{- /* A URL that carries its own sslmode keeps it: pg_dump prefers it to this. */}}
                - name: PGSSLMODE
                  value: {{ $sslMode | quote }}
                {{- end }}
                {{- if $caSecret }}
                - name: PGSSLROOTCERT
                  value: "/etc/hd/database-ca/ca.crt"
                {{- end }}
                - name: KEEP
                  value: {{ $d.keep | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  name="hd-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  # Written under a temporary name: an interrupted dump never counts as one.
                  pg_dump {{ if not $parameters }}--dbname="$DATABASE_URL" {{ end }}--format=custom --no-owner \
                    --file="/dumps/$name.partial"
                  mv "/dumps/$name.partial" "/dumps/$name"
                  ls -1t /dumps/hd-*.dump | tail -n +$((KEEP + 1)) | while read -r old; do
                    rm -f -- "$old"
                  done
                  rm -f /dumps/*.partial
                  echo "dumped $name; kept:"
                  ls -l /dumps
              resources:
                {{- toYaml $d.resources | nindent 16 }}
              securityContext:
                {{- include "hd.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                {{- if $caSecret }}
                - name: database-ca
                  mountPath: /etc/hd/database-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: {{ $claim }}
            {{- if $caSecret }}
            # Only the certificate, as for the core.
            - name: database-ca
              secret:
                secretName: {{ $caSecret }}
                items:
                  - key: {{ $db.ca.secretKey }}
                    path: ca.crt
            {{- end }}
{{- end }}
