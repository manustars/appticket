{{- if .Values.networkPolicy.enabled }}
# Ingress only. Egress stays open: the core reaches the database, mail servers and add-ons, the
# Assistant reaches the core and its model service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hd.coreName" . }}
  labels:
    {{- include "hd.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  podSelector:
    matchLabels:
      {{- include "hd.selectorLabels" (dict "root" . "component" "core") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      from:
        {{- with .Values.networkPolicy.coreFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "hd.selectorLabels" (dict "root" . "component" "assistant") | nindent 14 }}
    {{- if .Values.greenmail.enabled }}
    # Staging: testers reach the test mail server from inside the namespace.
    - ports:
        - port: smtp
        - port: imap
      from:
        - podSelector: {}
    {{- end }}
{{- if .Values.assistant.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hd.assistantName" . }}
  labels:
    {{- include "hd.labels" . | nindent 4 }}
    app.kubernetes.io/component: assistant
spec:
  podSelector:
    matchLabels:
      {{- include "hd.selectorLabels" (dict "root" . "component" "assistant") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: events
      from:
        - podSelector:
            matchLabels:
              {{- include "hd.selectorLabels" (dict "root" . "component" "core") | nindent 14 }}
{{- end }}
{{- end }}
