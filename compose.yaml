# Local development services: run with `podman compose up -d` (or `docker compose up -d`).
name: hd-dev

services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: hd
      POSTGRES_PASSWORD: hd
      POSTGRES_DB: hd
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hd -d hd"]
      interval: 2s
      retries: 30

  # Test mail server: SMTP on host port 55025, IMAP on 55143, no TLS (the 3000s are often
  # reserved by Windows). The help desk mailbox is
  # helpdesk@helpdesk.test (login "helpdesk", password "helpdesk").
  mail:
    image: docker.io/greenmail/standalone:2.1.8
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=helpdesk:helpdesk@helpdesk.test
        -Dgreenmail.users.login=local_part
        -Dgreenmail.verbose
    ports:
      - "127.0.0.1:55025:3025"
      - "127.0.0.1:55143:3143"

  # Test identity provider (OpenID Connect) on host port 55080, for development and CI only. The
  # realm in dev/keycloak is imported at start: issuer http://127.0.0.1:55080/realms/helpdesk,
  # client hd-core with secret dev-only-client-secret, and test users such as lena (password
  # lena-dev-password). Nothing is kept: a new container starts from the realm file again.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      # The issuer is the same for the core and the browser, whichever address reaches it.
      KC_HOSTNAME: http://127.0.0.1:55080
    ports:
      - "127.0.0.1:55080:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro

  # Test Zabbix for the Zabbix add-on (addons/zabbix), for development and CI only, started only
  # with its profile: `podman compose --profile zabbix up -d`. The frontend and its API are on
  # host port 55180 (http://127.0.0.1:55180/api_jsonrpc.php), with the user Admin and the password
  # zabbix of a fresh Zabbix. At its first start the server sets up its database, which takes a
  # minute or two; nothing is kept once the containers are removed.
  zabbix-db:
    image: docker.io/library/postgres:16
    profiles: [zabbix]
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix

  zabbix-server:
    image: docker.io/zabbix/zabbix-server-pgsql:alpine-7.0.32
    profiles: [zabbix]
    init: true
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    depends_on: [zabbix-db]

  zabbix-web:
    image: docker.io/zabbix/zabbix-web-nginx-pgsql:alpine-7.0.32
    profiles: [zabbix]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    ports:
      - "127.0.0.1:55180:8080"
    depends_on: [zabbix-server]

volumes:
  db-data:
