# Temporary: signs in at a fresh Keycloak again and again with the burst of .github/hunt/burst.sh,
# to find out how often its ID tokens lack the groups claim and whether that sticks. Lives on a
# scratch branch only.
name: Hunt the Keycloak group failure

on:
  push:
    branches: [hunt-keycloak-groups]

permissions:
  contents: read

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        arm: [plain, load]
    steps:
      - uses: actions/checkout@v5
      - name: Rounds
        env:
          ARM: ${{ matrix.arm }}
          ROUNDS: "40"
        run: bash .github/hunt/burst.sh
      - uses: actions/upload-artifact@v4
        with:
          name: caught-${{ matrix.arm }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/caught
          if-no-files-found: ignore
