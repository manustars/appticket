# Temporary: signs in at a fresh Keycloak again and again with the burst of .github/hunt/burst.sh,
# to find out how often its ID tokens lack the groups claim and whether that sticks. Lives on a
# scratch branch only.
name: Hunt the Keycloak group failure

on:
  push:
    branches: [hunt-keycloak-groups]

permissions:
  contents: read

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arm: warm, shard: 1 }
          - { arm: warm, shard: 2 }
          - { arm: warm, shard: 3 }
          - { arm: warm, shard: 4 }
          - { arm: warm, shard: 5 }
          - { arm: warm, shard: 6 }
          - { arm: warm, shard: 7 }
          - { arm: warm, shard: 8 }
          - { arm: warm, shard: 9 }
          - { arm: warm, shard: 10 }
          - { arm: warm, shard: 11 }
          - { arm: warm, shard: 12 }
    steps:
      - uses: actions/checkout@v5
      - name: Rounds
        env:
          ARM: ${{ matrix.arm }}
          ROUNDS: "50"
        run: bash .github/hunt/burst.sh
      - uses: actions/upload-artifact@v4
        with:
          name: caught-${{ matrix.arm }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/caught
          if-no-files-found: ignore
