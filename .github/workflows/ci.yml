name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The tests run on the oldest PostgreSQL the help desk supports and on the newest (ADR 0009);
  # the checks that do not depend on the database run on the newest only.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
        include:
          - postgres: "18"
            checks: true
    services:
      db:
        image: docker.io/library/postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: hd
          POSTGRES_PASSWORD: hd
          POSTGRES_DB: hd
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U hd -d hd" --health-interval 2s --health-retries 30
      mail:
        image: docker.io/greenmail/standalone:2.1.8
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=helpdesk:helpdesk@helpdesk.test -Dgreenmail.users.login=local_part
        ports: ["55025:3025", "55143:3143"]
    env:
      DATABASE_URL: postgres://hd:hd@127.0.0.1:55432/hd
      HD_DATABASE_URL: postgres://hd:hd@127.0.0.1:55432/hd
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      # The test identity provider, as in compose.yaml. Not a service: it needs a start command
      # and the realm file from the checkout. It starts while the code builds.
      - name: Start Keycloak
        run: >-
          docker run -d --name keycloak -p 127.0.0.1:55080:8080
          -e KC_HOSTNAME=http://127.0.0.1:55080
          -v "$GITHUB_WORKSPACE/dev/keycloak:/opt/keycloak/data/import:ro"
          quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm
      # A PostgreSQL serving TLS with a certificate from a test authority made by the script, for
      # the test that connects with verify-full. Not a service: the certificate is copied in.
      - name: Start the TLS test database
        run: >-
          CONTAINER_ENGINE=docker bash scripts/tls-test-database.sh "$RUNNER_TEMP/tls-database"
          >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # A cache per leg, so that the leg without clippy does not save the one the other restores.
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres-${{ matrix.postgres }}
      - if: matrix.checks
        run: cargo fmt --check
      - if: matrix.checks
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 90); do
            if curl -sf http://127.0.0.1:55080/realms/helpdesk/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs keycloak
          exit 1
      # Includes the tests that need the test mail server, Keycloak and the TLS test database.
      - run: cargo test --locked -- --include-ignored
      - name: The UI's copy of the API specification is current
        if: matrix.checks
        run: cargo run -q --locked -p hd-core -- openapi | diff -u web/openapi.json -

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The denylist is private and never committed; CI runs the other checks.
      - run: bash scripts/scan-clean.sh
        env:
          SCAN_DENYLIST: none

  # The deployment artifacts: the Helm chart lints and renders, and both images build (nothing is
  # pushed; publishing happens in release.yml on version tags).
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/chart
      - run: helm lint deploy/chart -f deploy/chart/values-staging.example.yaml
      - run: helm template hd deploy/chart -f deploy/chart/values-staging.example.yaml > /dev/null
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: core
          push: false
          cache-from: type=gha,scope=hd
          cache-to: type=gha,scope=hd,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: assistant
          push: false
          cache-from: type=gha,scope=hd
