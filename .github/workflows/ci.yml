name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The tests run on the oldest PostgreSQL the help desk supports and on the newest (ADR 0009);
  # the checks that do not depend on the database run on the newest only.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
        include:
          - postgres: "18"
            checks: true
    services:
      db:
        image: docker.io/library/postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: hd
          POSTGRES_PASSWORD: hd
          POSTGRES_DB: hd
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U hd -d hd" --health-interval 2s --health-retries 30
      mail:
        image: docker.io/greenmail/standalone:2.1.8
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=helpdesk:helpdesk@helpdesk.test -Dgreenmail.users.login=local_part
        ports: ["55025:3025", "55143:3143"]
    env:
      DATABASE_URL: postgres://hd:hd@127.0.0.1:55432/hd
      HD_DATABASE_URL: postgres://hd:hd@127.0.0.1:55432/hd
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      # The test identity provider, as in compose.yaml. Not a service: it needs a start command
      # and the realm file from the checkout. It starts while the code builds.
      - name: Start Keycloak
        run: >-
          docker run -d --name keycloak -p 127.0.0.1:55080:8080
          -e KC_HOSTNAME=http://127.0.0.1:55080
          -v "$GITHUB_WORKSPACE/dev/keycloak:/opt/keycloak/data/import:ro"
          quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm
      # A PostgreSQL of the leg's version serving TLS with a certificate from a test authority made
      # by the script, for the test that connects with verify-full. Not a service: the certificate
      # is copied in.
      - name: Start the TLS test database
        run: >-
          CONTAINER_ENGINE=docker IMAGE=docker.io/library/postgres:${{ matrix.postgres }}
          bash scripts/tls-test-database.sh "$RUNNER_TEMP/tls-database"
          >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # A cache per leg, so that the leg without clippy does not save the one the other restores.
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres-${{ matrix.postgres }}
      - if: matrix.checks
        run: cargo fmt --check
      - if: matrix.checks
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 90); do
            if curl -sf http://127.0.0.1:55080/realms/helpdesk/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs keycloak
          exit 1
      # Includes the tests that need the test mail server, Keycloak and the TLS test database.
      - run: cargo test --locked -- --include-ignored
      - name: The UI's copy of the API specification is current
        if: matrix.checks
        run: cargo run -q --locked -p hd-core -- openapi | diff -u web/openapi.json -

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The denylist is private and never committed; CI runs the other checks.
      - run: bash scripts/scan-clean.sh
        env:
          SCAN_DENYLIST: none

  # The deployment artifacts: the Helm chart lints and renders, both images build (nothing is
  # pushed; publishing happens in release.yml on version tags), and the chart installs with its
  # own PostgreSQL and the core's image built here, in a kind cluster, and in another one is
  # upgraded from the released chart on a CloudNativePG cluster.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      # What the chart renders, lints and refuses in each database mode (postgresql.mode), the
      # default values and the staging example included.
      - name: The chart's database modes
        run: bash scripts/chart-database-modes.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: core
          push: false
          # Into the runner's Docker, for the kind cluster below.
          load: true
          tags: hd-core:ci
          cache-from: type=gha,scope=hd
          cache-to: type=gha,scope=hd,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: assistant
          push: false
          cache-from: type=gha,scope=hd
      # postgresql.mode=standalone in a kind cluster (the runner's own kind): install, upgrade to a
      # later chart with the same password, uninstall with the volume kept, install again.
      - name: Install, upgrade and uninstall the chart with its own PostgreSQL
        run: bash scripts/test-standalone-install.sh hd-core:ci
      # The upgrade guard in a kind cluster with the CloudNativePG operator: the released chart,
      # whose default was a CloudNativePG cluster, is installed and then upgraded to this one. With
      # the default values the upgrade is refused; with postgresql.mode=cloudnativepg it keeps the
      # data; and a standalone release is refused another mode. The script fetches the released
      # tag, which the checkout above does not hold.
      - name: Upgrade from the released chart, and the guard's refusals
        run: bash scripts/test-upgrade-guard.sh hd-core:ci

  # The Compose install as a release ships it: the release archive that release.yml attaches to
  # a GitHub release, built by the same script (scripts/package-compose.sh) under a test
  # version, which that script's own test checks first, and unpacked into a directory outside
  # the checkout. From there, with both images built here under that version, as the archive
  # names them: docker compose starts it with its own PostgreSQL (the profile db), then with the
  # Assistant and the test mail server beside it, and then without the profile db on a
  # PostgreSQL that the script starts itself and gives through HD_DATABASE_*; it dumps both
  # databases and restores a dump into a fresh install; and then it runs behind proxies: an
  # nginx that the script starts on the host's network with the documented example, and Caddy of
  # the profile https with each of its three certificates. The images build from the cache that
  # the deploy job wrote on earlier runs: both jobs run at once, so a change to the Dockerfile or
  # the code builds here without it.
  compose:
    runs-on: ubuntu-latest
    env:
      # Not a version a release can have: a release's tag agrees with the chart's version.
      TEST_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v5
      - name: The release archive's script, tested
        run: bash scripts/test-package-compose.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: core
          push: false
          # Into the runner's Docker, where Compose finds it and pulls nothing.
          load: true
          tags: ghcr.io/manustars/hd-core:${{ env.TEST_VERSION }}
          cache-from: type=gha,scope=hd
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: assistant
          push: false
          load: true
          tags: ghcr.io/manustars/hd-assistant:${{ env.TEST_VERSION }}
          cache-from: type=gha,scope=hd
      - name: Build the release archive and unpack it outside the checkout
        id: archive
        run: |
          bash scripts/package-compose.sh "$TEST_VERSION" "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/dist/hd-compose-$TEST_VERSION.tar.gz" -C "$RUNNER_TEMP/unpacked"
          unpacked="$RUNNER_TEMP/unpacked/hd-compose-$TEST_VERSION"
          echo "Unpacked into $unpacked:"
          ls -la "$unpacked"
          echo "dir=$unpacked" >> "$GITHUB_OUTPUT"
      - name: Install from the archive, with its own PostgreSQL and with an existing one
        env:
          COMPOSE_DIR: ${{ steps.archive.outputs.dir }}
        run: bash scripts/test-compose.sh "$TEST_VERSION"

  # Publishing the chart, without a release: the script that a release runs (release.yml) pushes
  # the chart to a throwaway registry, and what it pushed is pulled back and rendered.
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - name: Start a throwaway registry
        run: docker run -d -p 127.0.0.1:55466:5000 docker.io/library/registry:3.0.0
      - run: bash scripts/test-publish-chart.sh 127.0.0.1:55466
