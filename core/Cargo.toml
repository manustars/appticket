[package]
name = "hd-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mail-parser = "1.0.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "tls-rustls"] }
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1.0.12"

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
tower = { version = "0.5.3", features = ["util"] }
