# The Zabbix add-on's configuration file, read from HD_ZABBIX_CONFIG (zabbix.toml in the working
# directory by default). Its three secrets are not here: HD_ZABBIX_TOKEN (or HD_ZABBIX_TOKEN_FILE)
# holds the token `hd addon add` printed, HD_ZABBIX_EVENT_SECRET (or HD_ZABBIX_EVENT_SECRET_FILE)
# the event secret it printed, and HD_ZABBIX_API_TOKEN (or HD_ZABBIX_API_TOKEN_FILE) an API token
# of the Zabbix user the add-on reads as.

[core]
# The help desk core's base URL.
url = "https://helpdesk.example.com"
# The help desk's UI as agents' browsers reach it, for the address of a ticket's page that
# Zabbix's event menu opens, when the add-on reaches the core at another one (default url).
# ui_url = "https://helpdesk.example.com"

[zabbix]
# The base URL of Zabbix's frontend; the API is <url>/api_jsonrpc.php.
url = "https://zabbix.example.com"
# The system's name as customers' external references name it (default Zabbix).
system = "Zabbix"
# Seconds a call to Zabbix may take (default 30); reads of live details take at most 1.5.
timeout_seconds = 30
# The frontend's base URL as agents' browsers reach it, for the links of live details, when the
# add-on reaches Zabbix at another one (default url).
# frontend_url = "https://zabbix.example.com"

[sync]
# Minutes between two reads of Zabbix's hosts, besides the one at startup (default 5).
interval_minutes = 5

[assets]
# The asset kind of a host no mapping below matches: one of the help desk's list.
default_kind = "Server"

# The first mapping that matches a host decides its kind: by a template it is linked to (its
# visible name), or by a tag, with or without a value; names and values compared ignoring case.
[[assets.kinds]]
tag = "device"
value = "printer"
kind = "Printer"

[[assets.kinds]]
template = "Windows by Zabbix agent"
kind = "Desktop"

[alerts]
# What an alert does: the first rule whose conditions all hold decides, and an alert no rule
# matches is ignored. A condition left out matches anything. Without rules, the default list opens
# a ticket with priority urgent for a disaster and one with priority high for a high, and ignores
# the rest. `hd-zabbix check` tells which rule an alert meets.

[[alerts.rules]]
name = "Backups"
# The trigger's name contains this text, ignoring case.
trigger_contains = "backup"
outcome = "ignore"

[[alerts.rules]]
name = "Mail at Brightfield"
# A customer, by name, or a host_group, which includes the groups nested in it; not both.
customer = "Brightfield"
# This severity or higher: not classified, information, warning, average, high or disaster.
min_severity = "average"
# Tags of the alert that must all be present, each with this value or with any.
tags = [{ tag = "service", value = "mail" }, { tag = "scope" }]
outcome = "open"
# low, normal, high or urgent.
priority = "high"

# Linked to the ticket when the customer uses it.
service = "Hosted mail"
# When the alert's problem recovers: resolve_if_not_worked_on (the default), resolve or note.
on_recovery = "resolve_if_not_worked_on"
# Close the problem in Zabbix when an agent resolves or closes the ticket, if its trigger allows
# closing it by hand (default false).
close_in_zabbix = false

[[alerts.rules]]
name = "Disaster"
min_severity = "disaster"
outcome = "open"
priority = "urgent"

[[alerts.rules]]
name = "High"
min_severity = "high"
outcome = "open"
priority = "high"

[addon]
# Where the add-on answers the core's reads of live details and receives its events on /events, at
# the URL `hd addon add --url` gave, and receives Zabbix's alerts on /webhook (default 127.0.0.1:8091): an address the Zabbix server
# reaches, when it is on another host.
listen = "127.0.0.1:8091"

# Zabbix's alerts, sent by the media type zabbix-media-type.yaml to http://<listen>/webhook.
# Without this section the add-on receives none.
# [webhook]
# The file holding the webhook's secret, of 16 characters or more, which Zabbix sends from the
# global macro {$HD_WEBHOOK_SECRET}; a relative path is from the working directory.
# secret_file = "/run/secrets/hd-zabbix-webhook"
