[package]
name = "hd-zabbix"
version = "0.1.0"
description = "The Zabbix add-on: the hosts of the host groups customers have become assets of the help desk's catalog."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hd-zabbix"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
dotenvy = "0.15.7"
hd-addon-sdk = { path = "../../sdk/rust" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde"] }

[dev-dependencies]
# A database of its own on the test server, for the core the tests against Zabbix run.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
# The tests' writes to Zabbix take turns.
tokio = { version = "1.54.1", features = ["sync"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
