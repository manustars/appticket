[package]
name = "hd-assistant"
version = "0.1.0"
description = "The Assistant: an add-on that reads incoming messages and proposes what to do."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hd-assistant"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
hd-addon-sdk = { path = "../../sdk/rust", features = ["axum"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

